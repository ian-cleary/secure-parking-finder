<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkSafe — Find Secure Parking by Location</title>
<style>
:root{
  --ink:#2b3a42; --mist:#eef2f3; --pine:#3d5a45; --amber:#c98a2d; --red:#b3402e; --green:#4a7c59;
  --script:'Yellowtail',cursive; --slab:'Zilla Slab',serif; --cond:'Oswald',sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Yellowtail&family=Zilla+Slab:wght@500;600;700&family=Oswald:wght@400;500;600&display=swap');
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--mist); color:var(--ink); line-height:1.5;}
.hero{background:linear-gradient(180deg,#2b3a42 0%,#3d5a45 100%); color:#fff; text-align:center; padding:3rem 1rem 2.5rem;}
.hero .wordmark{font-family:var(--script); font-size:3rem; color:#f4e8c1; text-shadow:0 2px 8px rgba(0,0,0,.3);}
.hero h1{font-family:var(--slab); font-size:1.4rem; font-weight:600; margin:.5rem 0;}
.hero p{font-family:var(--cond); text-transform:uppercase; letter-spacing:2px; font-size:.85rem; opacity:.85;}
.search{background:#fff; max-width:720px; margin:-1.5rem auto 0; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.12); padding:1.5rem; position:relative; z-index:2;}
.search label{font-family:var(--cond); text-transform:uppercase; letter-spacing:1px; font-size:.8rem; display:block; margin:.8rem 0 .3rem;}
.search input[type=text], .search select{width:100%; padding:.7rem; border:2px solid #d5dde0; border-radius:8px; font-size:1rem;}
.search input:focus, .search select:focus{outline:none; border-color:var(--pine);}
.btn{display:inline-block; background:var(--pine); color:#fff; font-family:var(--cond); text-transform:uppercase; letter-spacing:1.5px; padding:.8rem 2rem; border:none; border-radius:8px; font-size:1rem; cursor:pointer; margin-top:1rem;}
.btn:hover{background:#2f4636;}
.btn:disabled{opacity:.5; cursor:wait;}
#results{max-width:720px; margin:1.5rem auto; padding:0 1rem;}
.traffic{border-radius:12px; padding:1.2rem; margin-bottom:1rem; display:flex; align-items:center; gap:1rem;}
.traffic.green{background:#e6f2e8; border:2px solid var(--green);}
.traffic.amber{background:#fdf3e0; border:2px solid var(--amber);}
.traffic.red{background:#fbe9e5; border:2px solid var(--red);}
.traffic.grey{background:#eef2f3; border:2px solid #9aa5ab;}
.light{width:48px; height:48px; border-radius:50%; flex-shrink:0;}
.light.green{background:var(--green); box-shadow:0 0 12px rgba(74,124,89,.5);}
.light.amber{background:var(--amber); box-shadow:0 0 12px rgba(201,138,45,.5);}
.light.red{background:var(--red); box-shadow:0 0 12px rgba(179,64,46,.5);}
.light.grey{background:#9aa5ab;}
.traffic h3{font-family:var(--slab); font-size:1.1rem; margin-bottom:.2rem;}
.traffic p{font-size:.9rem;}
.card{background:#fff; border-radius:12px; padding:1.2rem; margin-bottom:1rem; box-shadow:0 2px 8px rgba(0,0,0,.08);}
.card h3{font-family:var(--slab); font-size:1.15rem; margin-bottom:.3rem;}
.card .meta{font-family:var(--cond); text-transform:uppercase; letter-spacing:1px; font-size:.75rem; color:#6b7a82; margin-bottom:.5rem;}
.card .secure{display:inline-block; font-family:var(--cond); font-size:.75rem; text-transform:uppercase; letter-spacing:1px; padding:.2rem .6rem; border-radius:20px; margin:.2rem .2rem .2rem 0;}
.secure.yes{background:#e6f2e8; color:var(--green);}
.secure.no{background:#fbe9e5; color:var(--red);}
.secure.maybe{background:#fdf3e0; color:#8a6d1d;}
.card p{font-size:.92rem; margin:.4rem 0;}
.card a{color:var(--pine); font-weight:600;}
.loading{text-align:center; padding:2rem; font-family:var(--cond); letter-spacing:1px; color:#6b7a82;}
footer{text-align:center; padding:2rem 1rem; font-size:.85rem; color:#6b7a82;}
footer a{color:var(--pine);}
.chip{display:inline-block; font-family:var(--cond); text-transform:uppercase; letter-spacing:1px; font-size:.75rem; padding:.3rem .8rem; border:2px solid var(--pine); border-radius:20px; margin:.2rem; cursor:pointer; background:#fff;}
.chip.on{background:var(--pine); color:#fff;}
</style>
</head>
<body>

<div class="hero">
  <div class="wordmark">ParkSafe</div>
  <h1>Find secure parking, know the risk</h1>
  <p>UK &amp; Europe &middot; Vehicle theft traffic lights</p>
</div>

<div class="search">
  <label for="addr">Street address</label>
  <input type="text" id="addr" placeholder="e.g. 10 Downing Street, London" autocomplete="off">
  <label>Vehicle type</label>
  <div id="vtype">
    <span class="chip on" data-v="car">Car</span>
    <span class="chip" data-v="classic">Classic car</span>
    <span class="chip" data-v="motorcycle">Motorcycle</span>
    <span class="chip" data-v="motorhome">Motorhome / Campervan</span>
    <span class="chip" data-v="van">Van</span>
  </div>
  <button class="btn" id="go">Find secure parking</button>
</div>

<div id="results"></div>

<footer>
  Theft data: <a href="https://data.police.uk/">police.uk</a> (UK, street-level vehicle crime) &middot;
  Parking data: <a href="https://www.openstreetmap.org/">OpenStreetMap</a> &middot;
  <a href="mailto:ian.cleary@gmail.com?subject=Bug%20report%3A%20ParkSafe">Report a bug 🐞</a>
</footer>

<script>
const $ = s => document.querySelector(s);
let vehicleType = 'car';

document.querySelectorAll('#vtype .chip').forEach(c => {
  c.onclick = () => {
    document.querySelectorAll('#vtype .chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    vehicleType = c.dataset.v;
  };
});

$('#go').onclick = async () => {
  const addr = $('#addr').value.trim();
  if (!addr) { alert('Enter a street address first.'); return; }
  const btn = $('#go');
  btn.disabled = true;
  btn.textContent = 'Searching…';
  $('#results').innerHTML = '<div class="loading">Locating address…</div>';

  try {
    // 1. Geocode via Nominatim
    const geo = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(addr)}`, {
      headers: {'Accept': 'application/json'}
    }).then(r => r.json());

    if (!geo.length) throw new Error('Address not found. Try a more specific address.');
    const {lat, lon, display_name} = geo[0];
    const country = geo[0].address?.country_code?.toUpperCase() || '';

    $('#results').innerHTML = '<div class="loading">Checking theft risk &amp; nearby parking…</div>';

    // 2. Theft risk (UK via police.uk, Europe via Eurostat, else fallback)
    let risk = null;
    if (country === 'GB') {
      risk = await getUKRisk(lat, lon);
    } else if (['FR','DE','ES','IT','NL','BE','AT','CH','PT','IE','DK','SE','NO','FI','PL','CZ','HU','GR','HR','SI','SK','RO','LU'].includes(country)) {
      risk = await getEurostatRisk(lat, lon, country);
    } else {
      risk = {level: 'grey', title: 'Theft data unavailable', detail: 'Vehicle-theft statistics are not available for this country yet. Exercise normal caution.'};
    }

    // 3. Find parking via Overpass
    const parking = await findParking(lat, lon, vehicleType);

    renderResults(display_name, risk, parking, vehicleType, country);

  } catch (e) {
    $('#results').innerHTML = `<div class="card"><h3>Something went wrong</h3><p>${e.message}</p></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Find secure parking';
  }
};

async function getUKRisk(lat, lon) {
  // police.uk data lags ~2 months; find the latest month with data by trying back from last month
  const now = new Date();
  let latest = null;
  for (let back = 1; back <= 4; back++) {
    const d = new Date(now.getFullYear(), now.getMonth() - back, 1);
    const m = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    try {
      const crimes = await fetch(`https://data.police.uk/api/crimes-street/vehicle-crime?lat=${lat}&lng=${lon}&date=${m}`).then(r => r.json());
      if (crimes.length > 0 || back === 4) { latest = {month: m, count: crimes.length}; break; }
      // 0 crimes might be genuine (rural) — verify with one more month before accepting
      const d2 = new Date(now.getFullYear(), now.getMonth() - back - 1, 1);
      const m2 = `${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,'0')}`;
      const c2 = await fetch(`https://data.police.uk/api/crimes-street/vehicle-crime?lat=${lat}&lng=${lon}&date=${m2}`).then(r => r.json());
      latest = {month: m, count: crimes.length + c2.length, months: 2};
      break;
    } catch(e) { continue; }
  }
  if (!latest) return {level: 'grey', title: 'Theft data unavailable', detail: 'Could not reach police.uk. Exercise normal caution.'};
  const total = latest.count;
  const label = latest.months ? `in ${latest.months} recent months` : `in ${latest.month}`;

  // Traffic light thresholds (vehicle crimes within ~1 mile)
  if (total <= 5) return {level: 'green', title: 'Low vehicle theft risk', detail: `${total} vehicle crimes reported nearby ${label}. This area looks safe — standard precautions are enough.`};
  if (total <= 20) return {level: 'amber', title: 'Moderate vehicle theft risk', detail: `${total} vehicle crimes reported nearby ${label}. Pick a supervised or CCTV-covered car park and don't leave valuables visible.`};
  return {level: 'red', title: 'High vehicle theft risk', detail: `${total} vehicle crimes reported nearby ${label}. Theft is rife here — use only supervised, barrier-controlled parking and consider a steering lock or tracker.`};
}

async function getEurostatRisk(lat, lon, country) {
  try {
    // Step 1: Find NUTS3 region via Overpass is_in
    // NUTS3 = admin_level 6 in FR/DE/ES/IT, admin_level 5 in some others; try 6 then 5
    let nutsCode = null;
    for (const lvl of [6, 5]) {
      const q = `[out:json][timeout:15];is_in(${lat},${lon})->.a;rel(pivot.a)[boundary=administrative][admin_level=${lvl}];out tags 5;`;
      const data = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        body: 'data=' + encodeURIComponent(q),
        headers: {'Content-Type': 'application/x-www-form-urlencoded'}
      }).then(r => r.json());
      const rel = (data.elements || []).find(e => e.tags && (e.tags['ref:nuts'] || e.tags['ref:EU:nuts']));
      if (rel) {
        nutsCode = (rel.tags['ref:nuts'] || rel.tags['ref:EU:nuts']).replace(/[^A-Z0-9]/gi, '').toUpperCase();
        break;
      }
    }
    if (!nutsCode) throw new Error('NUTS region not found');

    // Step 2: Query Eurostat for motor-vehicle theft per 100k (ICCS050211)
    const url = `https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/crim_gen_reg?format=JSON&lang=en&freq=A&unit=P_HTHAB&iccs=ICCS050211&geo=${nutsCode}&time=2024`;
    const es = await fetch(url).then(r => r.json());
    const vals = Object.values(es.value || {});
    if (!vals.length) throw new Error('No data');
    const rate = vals[0]; // thefts per 100,000 inhabitants

    // Traffic light from per-100k rate (calibrated: Paris ~189 = red)
    if (rate < 50) return {level: 'green', title: 'Low vehicle theft risk', detail: `${Math.round(rate)} vehicle thefts per 100,000 people in this area (Eurostat 2024). This area looks safe.`};
    if (rate < 140) return {level: 'amber', title: 'Moderate vehicle theft risk', detail: `${Math.round(rate)} vehicle thefts per 100,000 people in this area (Eurostat 2024). Choose secure parking and take precautions.`};
    return {level: 'red', title: 'High vehicle theft risk', detail: `${Math.round(rate)} vehicle thefts per 100,000 people in this area (Eurostat 2024). Vehicle theft is rife here — use only the most secure parking.`};
  } catch(e) {
    return {level: 'grey', title: 'Theft data unavailable', detail: 'Could not retrieve European theft statistics for this location. Exercise normal caution.'};
  }
}

async function findParking(lat, lon, vtype) {
  // Overpass query for parking near location
  let filter = '[amenity=parking]';
  if (vtype === 'motorcycle') filter = '[amenity=motorcycle_parking]';

  const query = `[out:json][timeout:25];(node(around:2000,${lat},${lon})${filter};way(around:2000,${lat},${lon})${filter};);out center 30;`;

  try {
    const data = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query),
      headers: {'Content-Type': 'application/x-www-form-urlencoded'}
    }).then(r => r.json());

    return (data.elements || []).map(el => {
      const t = el.tags || {};
      const plat = el.lat || el.center?.lat;
      const plon = el.lon || el.center?.lon;
      const dist = plat ? Math.round(haversine(lat, lon, plat, plon) * 1000) : null;

      // Security scoring from OSM tags (ranked by research)
      const secure = [];
      let score = 0;
      if (t.supervised === 'yes') { secure.push('Supervised'); score += 3; }
      if (t.surveillance === 'yes' || t['surveillance:type'] === 'camera') { secure.push('CCTV'); score += 2; }
      if (t.access === 'private' || t.access === 'permit' || t.access === 'customers') { secure.push('Restricted access'); score += 2; }
      if (t.fee === 'yes') { secure.push('Paid'); score += 1; }
      if (t.parking === 'multi-storey' || t.parking === 'underground') { secure.push('Enclosed'); score += 2; }
      if (t.barrier === 'lift_gate' || t.barrier === 'gate') { secure.push('Barrier'); score += 1; }
      if (t.lit === 'yes') { secure.push('Lit'); score += 1; }
      if (t.covered === 'yes') { secure.push('Covered'); score += 1; }
      if (t.fenced === 'yes') { secure.push('Fenced'); score += 1; }
      if (vtype === 'motorhome' && t.motorhome_stopover === 'yes') { secure.push('Motorhome stopover'); score += 2; }

      return {
        name: t.name || 'Unnamed parking',
        dist,
        secure,
        score,
        opening: t.opening_hours || null,
        maxheight: t.maxheight || null,
        capacity: t.capacity || null,
        operator: t.operator || null,
        fee: t.fee,
        lat: plat, lon: plon
      };
    }).filter(p => p.lat).sort((a,b) => (b.score - a.score) || ((a.dist||99999) - (b.dist||99999))).slice(0, 10);

  } catch(e) {
    return [];
  }
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function renderResults(addr, risk, parking, vtype, country) {
  const vlabel = {car:'Car', classic:'Classic car', motorcycle:'Motorcycle', motorhome:'Motorhome / Campervan', van:'Van'}[vtype] || vtype;
  let html = `<div class="traffic ${risk.level}"><div class="light ${risk.level}"></div><div><h3>${risk.title}</h3><p>${risk.detail}</p></div></div>`;

  html += `<div class="card"><h3>📍 ${addr}</h3><p class="meta">Parking for: ${vlabel}</p></div>`;

  if (!parking.length) {
    html += `<div class="card"><h3>No mapped parking found within 2km</h3><p>OpenStreetMap doesn't list parking here yet. Try these instead:</p><ul style="margin:.5rem 0 .5rem 1.2rem; font-size:.92rem;"><li><a href="https://www.parkopedia.com/">Parkopedia</a> — bookable spaces, often with CCTV ratings</li><li><a href="https://www.justpark.com/">JustPark</a> — driveways &amp; private spaces nearby</li><li><a href="https://en.parkindigo.com/">Indigo</a> / <a href="https://www.q-park.co.uk/">Q-Park</a> — multi-storeys with barriers &amp; CCTV</li></ul></div>`;
  } else {
    // Top pick: highest security score within 1.5km, else closest secure
    const topPick = parking[0];
    const confLabel = topPick.score >= 5 ? 'High confidence' : topPick.score >= 2 ? 'Reasonable confidence' : 'Basic — verify on arrival';
    const confClass = topPick.score >= 5 ? 'yes' : topPick.score >= 2 ? 'maybe' : 'no';

    html += `<div class="card" style="border:2px solid var(--pine);"><h3>⭐ Top pick: ${topPick.name}</h3><p class="meta">${topPick.dist ? (topPick.dist/1000).toFixed(1) + ' km away' : ''} &middot; <span class="secure ${confClass}">${confLabel}</span></p><div>${topPick.secure.map(s => `<span class="secure yes">${s}</span>`).join('') || '<span class="secure maybe">No security details mapped — check on arrival</span>'}</div>${parkDetails(topPick, vtype)}<p><a href="https://www.google.com/maps/dir/?api=1&destination=${topPick.lat},${topPick.lon}" target="_blank">Get directions →</a></p></div>`;

    html += `<h3 style="font-family:var(--slab); margin:1.2rem 0 .5rem;">Other options nearby</h3>`;
    parking.slice(1).forEach(p => {
      const cl = p.score >= 5 ? 'yes' : p.score >= 2 ? 'maybe' : 'no';
      const clt = p.score >= 5 ? 'High' : p.score >= 2 ? 'Reasonable' : 'Basic';
      html += `<div class="card"><h3>${p.name}</h3><p class="meta">${p.dist ? (p.dist/1000).toFixed(1) + ' km' : ''} &middot; <span class="secure ${cl}">${clt} confidence</span></p><div>${p.secure.map(s => `<span class="secure yes">${s}</span>`).join('') || '<span class="secure maybe">Security unknown</span>'}</div>${parkDetails(p, vtype)}<p><a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank">Get directions →</a></p></div>`;
    });
  }

  // Confidence checklist tailored to vehicle + risk
  html += confidenceChecklist(vtype, risk.level);

  $('#results').innerHTML = html;
}

function parkDetails(p, vtype) {
  let d = '';
  if (p.operator) d += `<p style="font-size:.85rem;">Operated by <b>${p.operator}</b></p>`;
  if (p.opening) d += `<p style="font-size:.85rem;">Hours: ${p.opening}</p>`;
  if (p.maxheight) d += `<p style="font-size:.85rem;">Max height: ${p.maxheight}${(vtype==='motorhome'||vtype==='van') ? ' — <b>check your vehicle fits</b>' : ''}</p>`;
  if (p.capacity) d += `<p style="font-size:.85rem;">Capacity: ~${p.capacity} spaces</p>`;
  return d;
}

function confidenceChecklist(vtype, riskLevel) {
  const items = {
    car: ['Lock and take valuables with you', 'Park under a light or camera where possible', 'Note the bay number / level for later'],
    classic: ['Use a steering-wheel lock — visible deterrent matters', 'Prefer supervised or CCTV-monitored sites only', 'Consider a tracker if leaving overnight', 'Photograph the car\'s condition on arrival'],
    motorcycle: ['Chain to a ground anchor or immovable object', 'Disc lock on front wheel as minimum', 'Cover the bike — out of sight helps', 'Park near CCTV or staffed entrances'],
    motorhome: ['Check height barrier before entering', 'Confirm overnight stays are allowed', 'Level the van and lock all external hatches', 'Don\'t leave awnings or valuables outside'],
    van: ['Back into the bay against a wall if possible', 'Deadlock doors; consider a slam-lock', 'Remove tools or lock them in a bolted box', 'Park in view of cameras, not dark corners']
  };
  const list = (items[vtype] || items.car).map(i => `<li>${i}</li>`).join('');
  const riskNote = riskLevel === 'red'
    ? '<p style="margin-top:.5rem;"><b>This is a high-theft area.</b> A visible deterrent (lock, chain, tracker) is strongly advised even in supervised parking.</p>'
    : riskLevel === 'amber' ? '<p style="margin-top:.5rem;">Moderate-theft area — the basics above go a long way here.</p>' : '';
  return `<div class="card"><h3>✅ Park-with-confidence checklist</h3><ul style="margin:.5rem 0 .5rem 1.2rem; font-size:.92rem;">${list}</ul>${riskNote}</div>`;
}
</script>
</body>
</html>
