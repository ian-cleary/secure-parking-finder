<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkSafe — Find Secure Parking by Location</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo+Black&display=swap');
:root{
  --paper:#FAF7F1; --ink:#1A1C19; --blue:#0B4EA2; --green:#007A3D;
  --red:#D43A2A; --amber:#E39A1F; --ok:#2F7D4A; --grey:#8A8D86;
  --disp:'Archivo Black',sans-serif; --body:'Archivo',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:var(--body); background:var(--paper); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;}

/* Masthead — motorway direction-sign panel */
.mast{background:var(--blue); color:#fff; padding:2.2rem 1rem 1.8rem; border-bottom:6px solid var(--ink);}
.mast-inner{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:1.1rem;}
.p-sign{width:64px; height:64px; background:var(--blue); border:4px solid #fff; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:var(--disp); font-size:2.2rem; color:#fff; flex-shrink:0; box-shadow:inset 0 0 0 2px var(--blue);}
.mast h1{font-family:var(--disp); font-size:1.9rem; letter-spacing:.5px; line-height:1.1;}
.mast .sub{font-size:.85rem; text-transform:uppercase; letter-spacing:3px; opacity:.9; margin-top:.3rem;}

/* Search panel — clean Scandi card, strong border */
.search{background:#fff; max-width:760px; margin:1.5rem auto 0; border:3px solid var(--ink); padding:1.4rem 1.4rem 1.2rem;}
.search label{font-weight:700; text-transform:uppercase; letter-spacing:1.5px; font-size:.75rem; display:block; margin:.9rem 0 .35rem;}
.search label:first-child{margin-top:0;}
.search input[type=text]{width:100%; padding:.75rem .9rem; border:2px solid var(--ink); font-family:var(--body); font-size:1rem; background:var(--paper);}
.search input:focus{outline:3px solid var(--blue); outline-offset:1px;}
.chip{display:inline-block; font-weight:600; text-transform:uppercase; letter-spacing:1px; font-size:.75rem; padding:.45rem .9rem; border:2px solid var(--ink); margin:.25rem .25rem .25rem 0; cursor:pointer; background:#fff; user-select:none;}
.chip.on{background:var(--ink); color:#fff;}
.btn{display:block; width:100%; background:var(--green); color:#fff; font-family:var(--disp); font-size:1.05rem; letter-spacing:1px; padding:.9rem; border:3px solid var(--ink); cursor:pointer; margin-top:1.2rem; text-transform:uppercase;}
.btn:hover{background:#006030;}
.btn:disabled{opacity:.55; cursor:wait;}

/* Results */
#results{max-width:760px; margin:1.5rem auto; padding:0 1rem;}
.route-sign{background:var(--blue); color:#fff; border:3px solid var(--ink); padding:1rem 1.2rem; margin-bottom:1rem; display:flex; align-items:center; gap:1rem;}
.route-sign.green{background:var(--ok);}
.route-sign.amber{background:#B87A12;}
.route-sign.red{background:var(--red);}
.route-sign.grey{background:var(--grey);}
/* Vertical traffic-light stack — motoring motif */
.tl-stack{display:flex; flex-direction:column; gap:5px; background:var(--ink); padding:8px 6px; flex-shrink:0;}
.tl-dot{width:22px; height:22px; border-radius:50%; background:#3a3d38;}
.tl-dot.lit-red{background:#ff4b33; box-shadow:0 0 8px #ff4b33;}
.tl-dot.lit-amber{background:#ffb52e; box-shadow:0 0 8px #ffb52e;}
.tl-dot.lit-green{background:#3ddc74; box-shadow:0 0 8px #3ddc74;}
.route-sign h3{font-family:var(--disp); font-size:1.05rem; margin-bottom:.15rem; text-transform:uppercase; letter-spacing:.5px;}
.route-sign p{font-size:.9rem; line-height:1.45;}

.card{background:#fff; border:3px solid var(--ink); padding:1.15rem 1.2rem; margin-bottom:1rem;}
.card.toppick{border-width:4px; position:relative;}
.card.toppick::before{content:'TOP PICK'; position:absolute; top:-15px; left:12px; background:var(--green); color:#fff; font-family:var(--disp); font-size:.7rem; letter-spacing:1.5px; padding:.2rem .7rem; border:2px solid var(--ink);}
.card h3{font-family:var(--disp); font-size:1.1rem; margin-bottom:.25rem; line-height:1.25;}
.card .meta{font-weight:600; text-transform:uppercase; letter-spacing:1.5px; font-size:.72rem; color:#5a5e57; margin-bottom:.55rem;}
.tag{display:inline-block; font-weight:700; font-size:.72rem; text-transform:uppercase; letter-spacing:1px; padding:.25rem .65rem; border:2px solid var(--ink); margin:.2rem .25rem .2rem 0; background:#fff;}
.tag.yes{background:#E4F0E6; border-color:var(--ok); color:#1d5c33;}
.tag.maybe{background:#FBF3DF; border-color:var(--amber); color:#7a5a10;}
.tag.no{background:#FBE7E3; border-color:var(--red); color:#a02c1e;}
.card p{font-size:.93rem; margin:.35rem 0;}
.card ul{margin:.5rem 0 .5rem 1.2rem; font-size:.92rem;}
.card a{color:var(--blue); font-weight:700;}
.sec-h{font-family:var(--disp); font-size:1rem; text-transform:uppercase; letter-spacing:1px; margin:1.4rem 0 .2rem; padding-bottom:.3rem; border-bottom:3px solid var(--ink);}
.loading{text-align:center; padding:2.5rem; font-weight:600; letter-spacing:2px; text-transform:uppercase; font-size:.85rem; color:#5a5e57;}
footer{max-width:760px; margin:0 auto; padding:2rem 1rem 3rem; font-size:.82rem; color:#5a5e57; border-top:3px solid var(--ink);}
footer a{color:var(--blue); font-weight:600;}
.dir-arrow{display:inline-block; font-weight:700; margin-right:.4rem;}
</style>
</head>
<body>

<div class="mast">
  <div class="mast-inner">
    <div class="p-sign">P</div>
    <div>
      <h1>PARKSAFE</h1>
      <div class="sub">Secure parking finder &middot; UK &amp; Europe</div>
    </div>
  </div>
</div>

<div class="search">
  <label for="addr">Street address</label>
  <input type="text" id="addr" placeholder="e.g. Via Roma 1, Milano" autocomplete="off">
  <button type="button" id="locBtn" class="chip" style="margin-top:.5rem;">&#9678; Detect my location</button>
  <label>Vehicle type</label>
  <div id="vtype">
    <span class="chip on" data-v="car">Car</span>
    <span class="chip" data-v="classic">Classic</span>
    <span class="chip" data-v="motorcycle">Motorcycle</span>
    <span class="chip" data-v="motorhome">Motorhome</span>
    <span class="chip" data-v="van">Van</span>
  </div>
  <button class="btn" id="go">Find secure parking &rarr;</button>
</div>

<div id="results"></div>

<footer>
  <b>PARKSAFE</b> &middot; Theft data: <a href="https://data.police.uk/">police.uk</a> (UK, street-level vehicle crime) &middot;
  Parking data: <a href="https://www.openstreetmap.org/">OpenStreetMap</a> &middot;
  <a href="mailto:ian.cleary@gmail.com?subject=Bug%20report%3A%20ParkSafe">Report a bug 🐞</a>
</footer>

<script>
const $ = s => document.querySelector(s);
let vehicleType = 'car';

document.querySelectorAll('#vtype .chip').forEach(c => {
  c.onclick = () => {
    document.querySelectorAll('#vtype .chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    vehicleType = c.dataset.v;
  };
});

$('#locBtn').onclick = () => {
  if (!navigator.geolocation) { alert('Geolocation is not supported by this browser.'); return; }
  const b = $('#locBtn');
  b.textContent = 'Locating…';
  b.style.pointerEvents = 'none';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const {latitude, longitude} = pos.coords;
    try {
      const rev = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`, {
        headers: {'Accept': 'application/json'}
      }).then(r => r.json());
      $('#addr').value = rev.display_name || `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
    } catch(e) {
      $('#addr').value = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
    }
    b.innerHTML = '&#9678; Detect my location';
    b.style.pointerEvents = '';
    $('#go').click();
  }, (err) => {
    b.innerHTML = '&#9678; Detect my location';
    b.style.pointerEvents = '';
    alert('Could not get your location. Please enter an address manually.');
  }, {timeout: 10000});
};

$('#go').onclick = async () => {
  const addr = $('#addr').value.trim();
  if (!addr) { alert('Enter a street address first.'); return; }
  const btn = $('#go');
  btn.disabled = true;
  btn.textContent = 'Searching…';
  $('#results').innerHTML = '<div class="loading">Locating address…</div>';

  try {
    // 1. Geocode — or use raw coordinates if that's what's entered
    let lat, lon, display_name, country;
    const coordMatch = addr.match(/^(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)$/);
    if (coordMatch) {
      lat = parseFloat(coordMatch[1]); lon = parseFloat(coordMatch[2]);
      const rev = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`, {
        headers: {'Accept': 'application/json'}
      }).then(r => r.json()).catch(() => null);
      display_name = rev?.display_name || `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      country = rev?.address?.country_code?.toUpperCase() || '';
    } else {
      const geo = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(addr)}`, {
        headers: {'Accept': 'application/json'}
      }).then(r => r.json());
      if (!geo.length) throw new Error('Address not found. Try a more specific address.');
      ({lat, lon, display_name} = geo[0]);
      lat = parseFloat(lat); lon = parseFloat(lon);
      country = geo[0].address?.country_code?.toUpperCase() || '';
    }

    $('#results').innerHTML = '<div class="loading">Checking theft risk &amp; nearby parking…</div>';

    // 2. Theft risk (UK via police.uk, Europe via Eurostat, else fallback)
    let risk = null;
    if (country === 'GB') {
      risk = await getUKRisk(lat, lon);
    } else if (['FR','DE','ES','IT','NL','BE','AT','CH','PT','IE','DK','SE','NO','FI','PL','CZ','HU','GR','HR','SI','SK','RO','LU'].includes(country)) {
      risk = await getEurostatRisk(lat, lon, country);
    } else {
      risk = {level: 'grey', title: 'Theft data unavailable', detail: 'Vehicle-theft statistics are not available for this country yet. Exercise normal caution.'};
    }

    // 3. Find parking via Overpass
    const parking = await findParking(lat, lon, vehicleType);

    renderResults(display_name, risk, parking, vehicleType, country);

  } catch (e) {
    $('#results').innerHTML = `<div class="card"><h3>Something went wrong</h3><p>${e.message}</p></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Find secure parking';
  }
};

async function getUKRisk(lat, lon) {
  // police.uk data lags ~2 months; find the latest month with data by trying back from last month
  const now = new Date();
  let latest = null;
  for (let back = 1; back <= 4; back++) {
    const d = new Date(now.getFullYear(), now.getMonth() - back, 1);
    const m = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    try {
      const crimes = await fetch(`https://data.police.uk/api/crimes-street/vehicle-crime?lat=${lat}&lng=${lon}&date=${m}`).then(r => r.json());
      if (crimes.length > 0 || back === 4) { latest = {month: m, count: crimes.length}; break; }
      // 0 crimes might be genuine (rural) — verify with one more month before accepting
      const d2 = new Date(now.getFullYear(), now.getMonth() - back - 1, 1);
      const m2 = `${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,'0')}`;
      const c2 = await fetch(`https://data.police.uk/api/crimes-street/vehicle-crime?lat=${lat}&lng=${lon}&date=${m2}`).then(r => r.json());
      latest = {month: m, count: crimes.length + c2.length, months: 2};
      break;
    } catch(e) { continue; }
  }
  if (!latest) return {level: 'grey', title: 'Theft data unavailable', detail: 'Could not reach police.uk. Exercise normal caution.'};
  const total = latest.count;
  const label = latest.months ? `in ${latest.months} recent months` : `in ${latest.month}`;

  // Traffic light thresholds (vehicle crimes within ~1 mile)
  if (total <= 5) return {level: 'green', title: 'Low vehicle theft risk', detail: `${total} vehicle crimes reported nearby ${label}. This area looks safe — standard precautions are enough.`};
  if (total <= 20) return {level: 'amber', title: 'Moderate vehicle theft risk', detail: `${total} vehicle crimes reported nearby ${label}. Pick a supervised or CCTV-covered car park and don't leave valuables visible.`};
  return {level: 'red', title: 'High vehicle theft risk', detail: `${total} vehicle crimes reported nearby ${label}. Theft is rife here — use only supervised, barrier-controlled parking and consider a steering lock or tracker.`};
}

async function getEurostatRisk(lat, lon, country) {
  const rateToRisk = (rate, scope) => {
    if (rate < 50) return {level: 'green', title: 'Low vehicle theft risk', detail: `${Math.round(rate)} vehicle thefts per 100,000 people ${scope} (Eurostat 2024). This area looks safe.`};
    if (rate < 140) return {level: 'amber', title: 'Moderate vehicle theft risk', detail: `${Math.round(rate)} vehicle thefts per 100,000 people ${scope} (Eurostat 2024). Choose secure parking and take precautions.`};
    return {level: 'red', title: 'High vehicle theft risk', detail: `${Math.round(rate)} vehicle thefts per 100,000 people ${scope} (Eurostat 2024). Theft is rife here — use only the most secure parking.`};
  };
  const fetchRate = async (geo) => {
    const url = `https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/crim_gen_reg?format=JSON&lang=en&freq=A&unit=P_HTHAB&iccs=ICCS050211&geo=${geo}&time=2024`;
    const es = await fetch(url).then(r => r.json());
    const vals = Object.values(es.value || {});
    return vals.length ? vals[0] : null;
  };

  // Try NUTS3 regional rate first (via Overpass boundary lookup)
  try {
    let nutsCode = null;
    for (const lvl of [6, 5]) {
      const q = `[out:json][timeout:15];is_in(${lat},${lon})->.a;rel(pivot.a)[boundary=administrative][admin_level=${lvl}];out tags 5;`;
      const data = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        body: 'data=' + encodeURIComponent(q),
        headers: {'Content-Type': 'application/x-www-form-urlencoded'}
      }).then(r => r.json());
      const rel = (data.elements || []).find(e => e.tags && (e.tags['ref:nuts'] || e.tags['ref:EU:nuts']));
      if (rel) { nutsCode = (rel.tags['ref:nuts'] || rel.tags['ref:EU:nuts']).replace(/[^A-Z0-9]/gi, '').toUpperCase(); break; }
    }
    if (nutsCode) {
      const rate = await fetchRate(nutsCode);
      if (rate !== null) return rateToRisk(rate, 'in this region');
    }
  } catch(e) { /* fall through to national */ }

  // Fallback: national rate (no Overpass needed)
  try {
    const rate = await fetchRate(country);
    if (rate !== null) return rateToRisk(rate, 'nationally');
  } catch(e) {}

  return {level: 'grey', title: 'Theft data unavailable', detail: 'Could not retrieve European theft statistics for this location. Exercise normal caution.'};
}

async function findParking(lat, lon, vtype) {
  // Overpass query for parking near location
  let filter = '[amenity=parking]';
  if (vtype === 'motorcycle') filter = '[amenity=motorcycle_parking]';

  const query = `[out:json][timeout:25];(node(around:2000,${lat},${lon})${filter};way(around:2000,${lat},${lon})${filter};);out center 30;`;

  try {
    const data = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query),
      headers: {'Content-Type': 'application/x-www-form-urlencoded'}
    }).then(r => r.json());

    return (data.elements || []).map(el => {
      const t = el.tags || {};
      const plat = el.lat || el.center?.lat;
      const plon = el.lon || el.center?.lon;
      const dist = plat ? Math.round(haversine(lat, lon, plat, plon) * 1000) : null;

      // Security scoring from OSM tags (ranked by research)
      const secure = [];
      let score = 0;
      if (t.supervised === 'yes') { secure.push('Supervised'); score += 3; }
      if (t.surveillance === 'yes' || t['surveillance:type'] === 'camera') { secure.push('CCTV'); score += 2; }
      if (t.access === 'private' || t.access === 'permit' || t.access === 'customers') { secure.push('Restricted access'); score += 2; }
      if (t.fee === 'yes') { secure.push('Paid'); score += 1; }
      if (t.parking === 'multi-storey' || t.parking === 'underground') { secure.push('Enclosed'); score += 2; }
      if (t.barrier === 'lift_gate' || t.barrier === 'gate') { secure.push('Barrier'); score += 1; }
      if (t.lit === 'yes') { secure.push('Lit'); score += 1; }
      if (t.covered === 'yes') { secure.push('Covered'); score += 1; }
      if (t.fenced === 'yes') { secure.push('Fenced'); score += 1; }
      if (vtype === 'motorhome' && t.motorhome_stopover === 'yes') { secure.push('Motorhome stopover'); score += 2; }

      // Build a useful label when OSM has no name
      let label = t.name;
      if (!label) {
        const ptype = t.parking === 'multi-storey' ? 'Multi-storey car park'
          : t.parking === 'underground' ? 'Underground car park'
          : t.parking === 'surface' ? 'Surface car park'
          : t.parking === 'street_side' ? 'On-street parking'
          : t.parking === 'lane' ? 'Parking lane'
          : vtype === 'motorcycle' ? 'Motorcycle parking'
          : 'Car park';
        label = t.operator ? `${t.operator} — ${ptype.toLowerCase()}` : ptype;
        if (dist && dist < 1000) label += ` (${dist}m away)`;
      }

      return {
        name: label,
        dist,
        secure,
        score,
        opening: t.opening_hours || null,
        maxheight: t.maxheight || null,
        capacity: t.capacity || null,
        operator: t.operator || null,
        fee: t.fee,
        lat: plat, lon: plon
      };
    }).filter(p => p.lat).sort((a,b) => (b.score - a.score) || ((a.dist||99999) - (b.dist||99999))).slice(0, 10);

  } catch(e) {
    return [];
  }
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function renderResults(addr, risk, parking, vtype, country) {
  const vlabel = {car:'Car', classic:'Classic', motorcycle:'Motorcycle', motorhome:'Motorhome', van:'Van'}[vtype] || vtype;
  const lit = risk.level === 'red' ? 'lit-red' : risk.level === 'amber' ? 'lit-amber' : risk.level === 'green' ? 'lit-green' : '';
  const dots = ['red','amber','green'].map(c => `<div class="tl-dot ${risk.level===c?lit:''}"></div>`).join('');
  let html = `<div class="route-sign ${risk.level}"><div class="tl-stack">${dots}</div><div><h3>${risk.title}</h3><p>${risk.detail}</p></div></div>`;

  html += `<div class="card"><h3><span class="dir-arrow">&rarr;</span>${addr}</h3><p class="meta">Vehicle: ${vlabel}</p></div>`;

  if (!parking.length) {
    html += `<div class="card"><h3>No mapped parking within 2 km</h3><p>OpenStreetMap lists nothing here yet. Check reviews directly:</p><ul><li><a href="https://www.parkopedia.com/">Parkopedia</a> — ratings &amp; bookable spaces</li><li><a href="https://www.justpark.com/">JustPark</a> — reviewed private spaces</li><li><a href="https://en.parkindigo.com/">Indigo</a> / <a href="https://www.q-park.co.uk/">Q-Park</a> — operator sites with reviews</li></ul></div>`;
  } else {
    const topPick = parking[0];
    const conf = topPick.score >= 5 ? ['yes','High confidence'] : topPick.score >= 2 ? ['maybe','Reasonable confidence'] : ['no','Basic — verify on arrival'];
    html += `<div class="card toppick"><h3>${topPick.name}</h3><p class="meta">${topPick.dist ? (topPick.dist/1000).toFixed(1) + ' km' : ''} &middot; <span class="tag ${conf[0]}">${conf[1]}</span></p><div>${topPick.secure.map(s => `<span class="tag yes">${s}</span>`).join('') || '<span class="tag maybe">Security unmapped</span>'}</div>${parkDetails(topPick, vtype)}<p><a href="https://www.google.com/maps/dir/?api=1&destination=${topPick.lat},${topPick.lon}" target="_blank">Directions &rarr;</a> &middot; ${reviewLink(topPick)}</p></div>`;

    if (parking.length > 1) {
      html += `<div class="sec-h">Other options</div>`;
      parking.slice(1).forEach(p => {
        const c = p.score >= 5 ? ['yes','High'] : p.score >= 2 ? ['maybe','Reasonable'] : ['no','Basic'];
        html += `<div class="card"><h3>${p.name}</h3><p class="meta">${p.dist ? (p.dist/1000).toFixed(1) + ' km' : ''} &middot; <span class="tag ${c[0]}">${c[1]}</span></p><div>${p.secure.map(s => `<span class="tag yes">${s}</span>`).join('') || '<span class="tag maybe">Security unknown</span>'}</div>${parkDetails(p, vtype)}<p><a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank">Directions &rarr;</a> &middot; ${reviewLink(p)}</p></div>`;
      });
    }
  }

  html += confidenceChecklist(vtype, risk.level);
  $('#results').innerHTML = html;
}

function reviewLink(p) {
  const q = encodeURIComponent((p.name || 'parking') + ' parking');
  return `<a href="https://www.google.com/maps/search/?api=1&query=${q}+${p.lat},${p.lon}" target="_blank">&#9733; Reviews</a>`;
}

function parkDetails(p, vtype) {
  let d = '';
  if (p.operator) d += `<p style="font-size:.85rem;">Operated by <b>${p.operator}</b></p>`;
  if (p.opening) d += `<p style="font-size:.85rem;">Hours: ${p.opening}</p>`;
  if (p.maxheight) d += `<p style="font-size:.85rem;">Max height: ${p.maxheight}${(vtype==='motorhome'||vtype==='van') ? ' — <b>check your vehicle fits</b>' : ''}</p>`;
  if (p.capacity) d += `<p style="font-size:.85rem;">Capacity: ~${p.capacity} spaces</p>`;
  return d;
}

function confidenceChecklist(vtype, riskLevel) {
  const items = {
    car: ['Lock up, take valuables with you', 'Park under a light or camera', 'Note the bay number / level'],
    classic: ['Steering-wheel lock on — visible deterrent', 'Supervised or CCTV-monitored sites only', 'Tracker armed if leaving overnight', 'Photograph condition on arrival'],
    motorcycle: ['Chain to a ground anchor or fixed object', 'Disc lock as minimum', 'Cover it — out of sight helps', 'Near CCTV or staffed entrances'],
    motorhome: ['Check height barrier before entering', 'Confirm overnight stays allowed', 'Lock all external hatches', 'Nothing valuable left outside'],
    van: ['Back against a wall where possible', 'Deadlocks on; slam-locks considered', 'Tools in a bolted box or removed', 'In view of cameras, not dark corners']
  };
  const list = (items[vtype] || items.car).map(i => `<li>${i}</li>`).join('');
  const riskNote = riskLevel === 'red'
    ? '<p style="margin-top:.5rem;"><b>High-theft area.</b> A visible deterrent is strongly advised even in supervised parking.</p>'
    : riskLevel === 'amber' ? '<p style="margin-top:.5rem;">Moderate-theft area — the basics above go a long way.</p>' : '';
  return `<div class="sec-h">Park-with-confidence checklist</div><div class="card"><ul>${list}</ul>${riskNote}</div>`;
}
</script>
</body>
</html>
