<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkSafe — Find Secure Parking by Location</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo+Black&display=swap');
:root{
  --paper:#FAF7F1; --ink:#1A1C19; --blue:#0B4EA2; --green:#007A3D;
  --red:#D43A2A; --amber:#E39A1F; --ok:#2F7D4A; --grey:#8A8D86;
  --disp:'Archivo Black',sans-serif; --body:'Archivo',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:var(--body); background:var(--paper); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;}

/* Masthead — motorway direction-sign panel */
.mast{background:var(--blue); color:#fff; padding:2.2rem 1rem 1.8rem; border-bottom:6px solid var(--ink);}
.mast-inner{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:1.1rem;}
.p-sign{width:64px; height:64px; background:var(--blue); border:4px solid #fff; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:var(--disp); font-size:2.2rem; color:#fff; flex-shrink:0; box-shadow:inset 0 0 0 2px var(--blue);}
.mast h1{font-family:var(--disp); font-size:1.9rem; letter-spacing:.5px; line-height:1.1;}
.mast .sub{font-size:.85rem; text-transform:uppercase; letter-spacing:3px; opacity:.9; margin-top:.3rem;}

/* Search panel — clean Scandi card, strong border */
.search{background:#fff; max-width:760px; margin:1.5rem auto 0; border:3px solid var(--ink); padding:1.4rem 1.4rem 1.2rem;}
.search label{font-weight:700; text-transform:uppercase; letter-spacing:1.5px; font-size:.75rem; display:block; margin:.9rem 0 .35rem;}
.search label:first-child{margin-top:0;}
.search input[type=text]{width:100%; padding:.75rem .9rem; border:2px solid var(--ink); font-family:var(--body); font-size:1rem; background:var(--paper);}
.search input:focus{outline:3px solid var(--blue); outline-offset:1px;}
.chip{display:inline-block; font-weight:600; text-transform:uppercase; letter-spacing:1px; font-size:.75rem; padding:.45rem .9rem; border:2px solid var(--ink); margin:.25rem .25rem .25rem 0; cursor:pointer; background:#fff; user-select:none;}
.chip.on{background:var(--ink); color:#fff;}
.btn{display:block; width:100%; background:var(--green); color:#fff; font-family:var(--disp); font-size:1.05rem; letter-spacing:1px; padding:.9rem; border:3px solid var(--ink); cursor:pointer; margin-top:1.2rem; text-transform:uppercase;}
.btn:hover{background:#006030;}
.btn:disabled{opacity:.55; cursor:wait;}

/* Results */
#results{max-width:760px; margin:1.5rem auto; padding:0 1rem;}
.route-sign{background:var(--blue); color:#fff; border:3px solid var(--ink); padding:1rem 1.2rem; margin-bottom:1rem; display:flex; align-items:center; gap:1rem;}
.route-sign.green{background:var(--ok);}
.route-sign.amber{background:#B87A12;}
.route-sign.red{background:var(--red);}
.route-sign.grey{background:var(--grey);}
/* Vertical traffic-light stack — motoring motif */
.tl-stack{display:flex; flex-direction:column; gap:5px; background:var(--ink); padding:8px 6px; flex-shrink:0;}
.tl-dot{width:22px; height:22px; border-radius:50%; background:#3a3d38;}
.tl-dot.lit-red{background:#ff4b33; box-shadow:0 0 8px #ff4b33;}
.tl-dot.lit-amber{background:#ffb52e; box-shadow:0 0 8px #ffb52e;}
.tl-dot.lit-green{background:#3ddc74; box-shadow:0 0 8px #3ddc74;}
.route-sign h3{font-family:var(--disp); font-size:1.05rem; margin-bottom:.15rem; text-transform:uppercase; letter-spacing:.5px;}
.route-sign p{font-size:.9rem; line-height:1.45;}

.card{background:#fff; border:3px solid var(--ink); padding:1.15rem 1.2rem; margin-bottom:1rem;}
.card.toppick{border-width:4px; position:relative;}
.card.toppick::before{content:'TOP PICK'; position:absolute; top:-15px; left:12px; background:var(--green); color:#fff; font-family:var(--disp); font-size:.7rem; letter-spacing:1.5px; padding:.2rem .7rem; border:2px solid var(--ink);}
.card h3{font-family:var(--disp); font-size:1.1rem; margin-bottom:.25rem; line-height:1.25;}
.card .meta{font-weight:600; text-transform:uppercase; letter-spacing:1.5px; font-size:.72rem; color:#5a5e57; margin-bottom:.55rem;}
.tag{display:inline-block; font-weight:700; font-size:.72rem; text-transform:uppercase; letter-spacing:1px; padding:.25rem .65rem; border:2px solid var(--ink); margin:.2rem .25rem .2rem 0; background:#fff;}
.tag.yes{background:#E4F0E6; border-color:var(--ok); color:#1d5c33;}
.tag.maybe{background:#FBF3DF; border-color:var(--amber); color:#7a5a10;}
.tag.no{background:#FBE7E3; border-color:var(--red); color:#a02c1e;}
.card p{font-size:.93rem; margin:.35rem 0;}
.card ul{margin:.5rem 0 .5rem 1.2rem; font-size:.92rem;}
.card a{color:var(--blue); font-weight:700;}
.sec-h{font-family:var(--disp); font-size:1rem; text-transform:uppercase; letter-spacing:1px; margin:1.4rem 0 .2rem; padding-bottom:.3rem; border-bottom:3px solid var(--ink);}
.loading{text-align:center; padding:2.5rem; font-weight:600; letter-spacing:2px; text-transform:uppercase; font-size:.85rem; color:#5a5e57;}
footer{max-width:760px; margin:0 auto; padding:2rem 1rem 3rem; font-size:.82rem; color:#5a5e57; border-top:3px solid var(--ink);}
footer a{color:var(--blue); font-weight:600;}
.dir-arrow{display:inline-block; font-weight:700; margin-right:.4rem;}
</style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div class="mast">
  <div class="mast-inner">
    <div class="p-sign">P</div>
    <div>
      <h1>PARKSAFE</h1>
      <div class="sub">Secure parking finder &middot; UK &amp; Europe</div>
    </div>
  </div>
</div>

<div class="search">
  <label for="addr">Street address</label>
  <div style="position:relative;">
  <input type="text" id="addr" placeholder="e.g. Via Roma 1, Milano" autocomplete="off">
  <div id="suggest" style="display:none; position:absolute; top:100%; left:0; right:0; background:#fffdf7; border:2px solid var(--ink); border-top:none; z-index:50; max-height:220px; overflow-y:auto;"></div>
  </div>
  <button type="button" id="locBtn" class="chip" style="margin-top:.5rem;">&#9678; Detect my location</button>
  <label>Vehicle type</label>
  <div id="vtype">
    <span class="chip on" data-v="car">Car</span>
    <span class="chip" data-v="classic">Classic</span>
    <span class="chip" data-v="motorcycle">Motorcycle</span>
    <span class="chip" data-v="motorhome">Motorhome</span>
    <span class="chip" data-v="van">Van</span>
  </div>
  <button class="btn" id="go">Find secure parking &rarr;</button>
</div>

<div id="results"></div>

<footer>
  <b>PARKSAFE</b> &middot; Theft data: <a href="https://data.police.uk/">police.uk</a> (UK, street-level vehicle crime) &middot;
  Parking data: <a href="https://maps.google.com/">Google Places</a> &middot; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> &middot;
  <a href="mailto:ian.cleary@gmail.com?subject=Bug%20report%3A%20ParkSafe">Report a bug 🐞</a>
</footer>

<script>
const $ = s => document.querySelector(s);
let vehicleType = 'car';

document.querySelectorAll('#vtype .chip').forEach(c => {
  c.onclick = () => {
    document.querySelectorAll('#vtype .chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    vehicleType = c.dataset.v;
  };
});

$('#locBtn').onclick = () => {
  if (!navigator.geolocation) { alert('Geolocation is not supported by this browser.'); return; }
  const b = $('#locBtn');
  b.textContent = 'Locating…';
  b.style.pointerEvents = 'none';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const {latitude, longitude} = pos.coords;
    try {
      const rev = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat=${latitude}&lon=${longitude}`, {
        headers: {'Accept': 'application/json'}
      }).then(r => r.json());
      $('#addr').value = rev.display_name || `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
    } catch(e) {
      $('#addr').value = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
    }
    b.innerHTML = '&#9678; Detect my location';
    b.style.pointerEvents = '';
    $('#go').click();
  }, (err) => {
    b.innerHTML = '&#9678; Detect my location';
    b.style.pointerEvents = '';
    alert('Could not get your location. Please enter an address manually.');
  }, {timeout: 10000});
};

// Address autocomplete (debounced, via worker)
let acTimer = null;
$('#addr').addEventListener('input', () => {
  clearTimeout(acTimer);
  $('#addr').dataset.placeId = ''; // typed manually — don't use a stale place ID
  const q = $('#addr').value.trim();
  const box = $('#suggest');
  if (q.length < 3) { box.style.display = 'none'; return; }
  acTimer = setTimeout(async () => {
    try {
      const r = await fetch(`${PLACES_WORKER}/api/autocomplete?input=${encodeURIComponent(q)}`).then(r => r.json());
      const sug = r.suggestions || [];
      if (!sug.length) { box.style.display = 'none'; return; }
      box.innerHTML = sug.map((s, i) => `<div data-i="${i}" style="padding:.5rem .75rem; cursor:pointer; border-bottom:1px solid #e8e0cf; font-size:.9rem;">${s.text}</div>`).join('');
      box.style.display = 'block';
      box.querySelectorAll('div').forEach(d => {
        d.onclick = () => {
          $('#addr').value = sug[+d.dataset.i].text;
          $('#addr').dataset.placeId = sug[+d.dataset.i].placeId || '';
          box.style.display = 'none';
        };
        d.onmouseenter = () => d.style.background = '#f5f1e8';
        d.onmouseleave = () => d.style.background = '';
      });
    } catch(e) { /* silent */ }
  }, 350);
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('#suggest') && e.target.id !== 'addr') $('#suggest').style.display = 'none';
});

async function geocodeTolerant(addr) {
  const nq = async (q, cc) => {
    let url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&q=${encodeURIComponent(q)}`;
    if (cc) url += `&countrycodes=${cc}`;
    const r = await fetch(url, {headers: {'Accept': 'application/json'}}).then(r => r.json());
    return r.length ? r[0] : null;
  };
  const norm = (g) => ({lat: g.lat, lon: g.lon, display_name: g.display_name, country_code: g.address?.country_code?.toUpperCase() || ''});

  // 1. Try as-is
  let g = await nq(addr);
  if (g) return norm(g);

  // 2. UK postcode? (full like "DN21 4JT" or partial like "DN21")
  const pc = addr.trim().toUpperCase().match(/^([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})?$/);
  if (pc) {
    g = await nq(pc[0], 'gb');
    if (g) return norm(g);
  }

  // 3. Try with ", UK" appended (helps villages/hamlets)
  g = await nq(addr + ', UK', 'gb');
  if (g) return norm(g);

  // 4. Try with ", Europe" for continental addresses
  g = await nq(addr + ', Europe');
  if (g) return norm(g);

  throw new Error(`Couldn't find "${addr}". Try a full postcode, or add the town/city.`);
}

$('#go').onclick = async () => {
  const addr = $('#addr').value.trim();
  if (!addr) { alert('Enter a street address first.'); return; }
  const btn = $('#go');
  btn.disabled = true;
  btn.textContent = 'Searching…';
  $('#results').innerHTML = '<div class="loading">Locating address…</div>';

  try {
    // 1. Geocode — or use raw coordinates if that's what's entered
    let lat, lon, display_name, country;
    const coordMatch = addr.match(/^(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)$/);
    if (coordMatch) {
      lat = parseFloat(coordMatch[1]); lon = parseFloat(coordMatch[2]);
      const rev = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat=${lat}&lon=${lon}`, {
        headers: {'Accept': 'application/json'}
      }).then(r => r.json()).catch(() => null);
      display_name = rev?.display_name || `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      country = rev?.address?.country_code?.toUpperCase() || '';
    } else {
      // If picked from autocomplete, geocode via Google place ID (exact, skips Nominatim)
      const pid = $('#addr').dataset.placeId;
      if (pid) {
        const pl = await fetch(`${PLACES_WORKER}/api/place-location?place_id=${encodeURIComponent(pid)}`).then(r => r.json());
        if (pl.ok) {
          lat = pl.lat; lon = pl.lng; display_name = pl.display_name; country = pl.country_code;
        }
      }
      if (lat === undefined) {
        const geo = await geocodeTolerant(addr);
        ({lat, lon, display_name} = geo);
        lat = parseFloat(lat); lon = parseFloat(lon);
        country = geo.country_code;
      }
    }

    $('#results').innerHTML = '<div class="loading">Checking theft risk &amp; nearby parking…</div>';

    // 2. Theft risk (UK via police.uk, Europe via Eurostat, else fallback)
    let risk = null;
    if (country === 'GB') {
      risk = await getUKRisk(lat, lon);
    } else if (['FR','DE','ES','IT','NL','BE','AT','CH','PT','IE','DK','SE','NO','FI','PL','CZ','HU','GR','HR','SI','SK','RO','LU'].includes(country)) {
      risk = await getEurostatRisk(lat, lon, country);
    } else {
      risk = {level: 'grey', title: 'Theft data unavailable', detail: 'Vehicle-theft statistics are not available for this country yet. Exercise normal caution.'};
    }

    // 3. Find parking + hotels via Overpass (in parallel)
    const [parking, hotels] = await Promise.all([
      findParking(lat, lon, vehicleType),
      findHotels(lat, lon)
    ]);

    // 4. Street-crime watchout (UK: broader police.uk categories)
    let watchout = null;
    if (country === 'GB') watchout = await getStreetCrime(lat, lon);

    renderResults(display_name, risk, parking, hotels, watchout, vehicleType, country);

  } catch (e) {
    $('#results').innerHTML = `<div class="card"><h3>Something went wrong</h3><p>${e.message}</p></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Find secure parking';
  }
};

async function getUKRisk(lat, lon) {
  // police.uk data lags ~2 months; find the latest month with data by trying back from last month
  const now = new Date();
  let latest = null;
  for (let back = 1; back <= 4; back++) {
    const d = new Date(now.getFullYear(), now.getMonth() - back, 1);
    const m = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    try {
      const crimes = await fetch(`https://data.police.uk/api/crimes-street/vehicle-crime?lat=${lat}&lng=${lon}&date=${m}`).then(r => r.json());
      if (crimes.length > 0 || back === 4) { latest = {month: m, count: crimes.length}; break; }
      // 0 crimes might be genuine (rural) — verify with one more month before accepting
      const d2 = new Date(now.getFullYear(), now.getMonth() - back - 1, 1);
      const m2 = `${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,'0')}`;
      const c2 = await fetch(`https://data.police.uk/api/crimes-street/vehicle-crime?lat=${lat}&lng=${lon}&date=${m2}`).then(r => r.json());
      latest = {month: m, count: crimes.length + c2.length, months: 2};
      break;
    } catch(e) { continue; }
  }
  if (!latest) return {level: 'grey', title: 'Theft data unavailable', detail: 'Could not reach police.uk. Exercise normal caution.'};
  const total = latest.count;
  const label = latest.months ? `in ${latest.months} recent months` : `in ${latest.month}`;

  // Traffic light thresholds (vehicle crimes within ~1 mile)
  if (total <= 5) return {level: 'green', title: 'Low vehicle theft risk', detail: `${total} vehicle crimes reported nearby ${label}. This area looks safe — standard precautions are enough.`};
  if (total <= 20) return {level: 'amber', title: 'Moderate vehicle theft risk', detail: `${total} vehicle crimes reported nearby ${label}. Pick a supervised or CCTV-covered car park and don't leave valuables visible.`};
  return {level: 'red', title: 'High vehicle theft risk', detail: `${total} vehicle crimes reported nearby ${label}. Theft is rife here — use only supervised, barrier-controlled parking and consider a steering lock or tracker.`};
}

async function getStreetCrime(lat, lon) {
  // Broader street-crime watchout: top non-vehicle crime categories nearby
  try {
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth() - 2, 1);
    const m = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const crimes = await fetch(`https://data.police.uk/api/crimes-street/all-crime?lat=${lat}&lng=${lon}&date=${m}`).then(r => r.json());
    const cats = {};
    crimes.forEach(c => { if (c.category !== 'vehicle-crime') cats[c.category] = (cats[c.category] || 0) + 1; });
    const top = Object.entries(cats).sort((a,b) => b[1] - a[1]).slice(0, 3);
    if (!top.length || top[0][1] < 3) return null;
    const label = s => s.replace(/-/g, ' ');
    return `Also reported nearby in ${m}: ` + top.map(([c, n]) => `${n}× ${label(c)}`).join(', ') + '.';
  } catch(e) { return null; }
}

async function getEurostatRisk(lat, lon, country) {
  const rateToRisk = (rate, scope) => {
    if (rate < 50) return {level: 'green', title: 'Low vehicle theft risk', detail: `${Math.round(rate)} vehicle thefts per 100,000 people ${scope} (Eurostat 2024). This area looks safe.`};
    if (rate < 140) return {level: 'amber', title: 'Moderate vehicle theft risk', detail: `${Math.round(rate)} vehicle thefts per 100,000 people ${scope} (Eurostat 2024). Choose secure parking and take precautions.`};
    return {level: 'red', title: 'High vehicle theft risk', detail: `${Math.round(rate)} vehicle thefts per 100,000 people ${scope} (Eurostat 2024). Theft is rife here — use only the most secure parking.`};
  };
  const fetchRate = async (geo) => {
    const url = `https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/crim_gen_reg?format=JSON&lang=en&freq=A&unit=P_HTHAB&iccs=ICCS050211&geo=${geo}&time=2024`;
    const es = await fetch(url).then(r => r.json());
    const vals = Object.values(es.value || {});
    return vals.length ? vals[0] : null;
  };

  // Try NUTS3 regional rate first (via Overpass boundary lookup)
  try {
    let nutsCode = null;
    for (const lvl of [6, 5]) {
      const q = `[out:json][timeout:15];is_in(${lat},${lon})->.a;rel(pivot.a)[boundary=administrative][admin_level=${lvl}];out tags 5;`;
      const data = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        body: 'data=' + encodeURIComponent(q),
        headers: {'Content-Type': 'application/x-www-form-urlencoded'}
      }).then(r => r.json());
      const rel = (data.elements || []).find(e => e.tags && (e.tags['ref:nuts'] || e.tags['ref:EU:nuts']));
      if (rel) { nutsCode = (rel.tags['ref:nuts'] || rel.tags['ref:EU:nuts']).replace(/[^A-Z0-9]/gi, '').toUpperCase(); break; }
    }
    if (nutsCode) {
      const rate = await fetchRate(nutsCode);
      if (rate !== null) return rateToRisk(rate, 'in this region');
    }
  } catch(e) { /* fall through to national */ }

  // Fallback: national rate (no Overpass needed)
  try {
    const rate = await fetchRate(country);
    if (rate !== null) return rateToRisk(rate, 'nationally');
  } catch(e) {}

  return {level: 'grey', title: 'Theft data unavailable', detail: 'Could not retrieve European theft statistics for this location. Exercise normal caution.'};
}

async function findHotels(lat, lon) {
  // Hotels with parking — good overnight secure option
  const query = `[out:json][timeout:25];(node(around:3000,${lat},${lon})[tourism=hotel];way(around:3000,${lat},${lon})[tourism=hotel];);out center 20;`;
  try {
    const data = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query),
      headers: {'Content-Type': 'application/x-www-form-urlencoded'}
    }).then(r => r.json());
    return (data.elements || []).map(el => {
      const t = el.tags || {};
      const plat = el.lat || el.center?.lat;
      const plon = el.lon || el.center?.lon;
      const dist = plat ? Math.round(haversine(lat, lon, plat, plon) * 1000) : null;
      // Does it advertise parking?
      const hasParking = t.parking || t['parking:lane'] || /park/i.test(t.description || '');
      return {name: t.name || 'Hotel', dist, hasParking: !!hasParking, stars: t.stars || null, lat: plat, lon: plon};
    }).filter(h => h.lat && h.name !== 'Hotel').sort((a,b) => (a.dist||99999) - (b.dist||99999)).slice(0, 5);
  } catch(e) { return []; }
}

const PLACES_WORKER = 'https://wildskies-votes.wildskies-votes.workers.dev';

// Google Places result → security tags (operator reputation)
function operatorFromName(name) {
  const n = name.toLowerCase();
  if (n.includes('q-park') || n.includes('qpark')) return 'Q-Park';
  if (n.includes('ncp')) return 'NCP';
  if (n.includes('indigo')) return 'Indigo';
  if (n.includes('apcoa')) return 'APCOA';
  if (n.includes('britannia')) return 'Britannia';
  return null;
}
function inferSecurity(name, types) {
  const secure = [];
  const op = operatorFromName(name);
  if (op) { secure.push(op + ' operated'); }
  const n = name.toLowerCase();
  if (/multi.?storey|underground|car park|garage/.test(n)) secure.push('Enclosed');
  if (/cctv|secure|guarded/.test(n)) secure.push('CCTV');
  return secure;
}
function scoreFromGoogle(p) {
  let s = 1;
  const op = operatorFromName(p.name);
  if (op) s += 3; // known operator = CCTV, barriers, lighting
  if (p.rating && p.rating >= 4) s += 1;
  if (p.reviews > 50) s += 1;
  return s;
}

async function findParking(lat, lon, vtype) {
  // Query Google Places AND OSM in parallel, merge, dedupe by proximity
  const [googleResults, osmResults] = await Promise.all([
    fetchGoogleParking(lat, lon).catch(() => []),
    fetchOSMParking(lat, lon, vtype).catch(() => []),
  ]);

  // Dedupe: if an OSM result is within 150m of a Google result, it's the same place — keep Google's
  const merged = [...googleResults];
  for (const osm of osmResults) {
    const dup = merged.some(g => haversine(g.lat, g.lon, osm.lat, osm.lon) * 1000 < 150);
    if (!dup) merged.push(osm);
  }

  // Enrich unnamed OSM spots with street names
  const unnamed = merged.filter(p => p.needsStreet).slice(0, 10);
  await Promise.all(unnamed.map(async (p) => {
    try {
      const rev = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&zoom=16&lat=${p.lat}&lon=${p.lon}`, {
        headers: {'Accept': 'application/json'}
      }).then(r => r.json());
      const a = rev.address || {};
      const street = a.road || a.pedestrian || a.footway || a.cycleway || a.suburb || a.neighbourhood || a.hamlet || null;
      if (street) p.name = `${p.baseType} — ${street}`;
      else if (p.dist) p.name = `${p.baseType} (${p.dist < 1000 ? p.dist + 'm' : (p.dist/1000).toFixed(1) + 'km'} away)`;
    } catch(e) {
      if (p.dist) p.name = `${p.baseType} (${p.dist < 1000 ? p.dist + 'm' : (p.dist/1000).toFixed(1) + 'km'} away)`;
    }
  }));

  return merged.sort((a,b) => (b.score - a.score) || ((a.dist||99999) - (b.dist||99999))).slice(0, 15);
}

async function fetchGoogleParking(lat, lon) {
  const wRes = await fetch(`${PLACES_WORKER}/api/places?lat=${lat}&lng=${lon}`, {signal: AbortSignal.timeout(8000)}).then(r => r.json());
  if (!wRes.results || !wRes.results.length) return [];
  return wRes.results.map(p => ({
    name: p.name,
    address: p.address || null,
    photo: p.photo ? `${PLACES_WORKER}/api/photo?name=${encodeURIComponent(p.photo)}` : null,
    reviewSnippets: p.reviewSnippets || [],
    dist: Math.round(haversine(lat, lon, p.lat, p.lng) * 1000),
    secure: inferSecurity(p.name, p.types),
    score: scoreFromGoogle(p),
    opening: p.open_now === true ? 'Open now' : p.open_now === false ? 'Closed now' : null,
    maxheight: null,
    capacity: null,
    operator: operatorFromName(p.name),
    fee: null,
    lat: p.lat, lon: p.lng,
    rating: p.rating,
    reviews: p.reviews,
    place_id: p.place_id,
    source: 'google'
  }));
}

async function fetchOSMParking(lat, lon, vtype) {
  if (vtype === 'motorcycle') {
    filter = '[amenity=motorcycle_parking]';
    bfilter = '[amenity=motorcycle_parking]';
  } else {
    filter = '[amenity=parking]';
    bfilter = '[building=parking]';
  }

  const query = `[out:json][timeout:25];(node(around:3000,${lat},${lon})${filter};way(around:3000,${lat},${lon})${filter};relation(around:3000,${lat},${lon})${filter};way(around:3000,${lat},${lon})${bfilter};);out center 40;`;

  try {
    const data = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query),
      headers: {'Content-Type': 'application/x-www-form-urlencoded'}
    }).then(r => r.json());

    const spots = (data.elements || []).map(el => {
      const t = el.tags || {};
      const plat = el.lat || el.center?.lat;
      const plon = el.lon || el.center?.lon;
      const dist = plat ? Math.round(haversine(lat, lon, plat, plon) * 1000) : null;

      // Security scoring from OSM tags (ranked by research)
      const secure = [];
      let score = 0;
      if (t.supervised === 'yes') { secure.push('Supervised'); score += 3; }
      if (t.surveillance === 'yes' || t['surveillance:type'] === 'camera') { secure.push('CCTV'); score += 2; }
      if (t.access === 'private' || t.access === 'permit' || t.access === 'customers') { secure.push('Restricted access'); score += 2; }
      if (t.fee === 'yes') { secure.push('Paid'); score += 1; }
      if (t.parking === 'multi-storey' || t.parking === 'underground') { secure.push('Enclosed'); score += 2; }
      if (t.barrier === 'lift_gate' || t.barrier === 'gate') { secure.push('Barrier'); score += 1; }
      if (t.lit === 'yes') { secure.push('Lit'); score += 1; }
      if (t.covered === 'yes') { secure.push('Covered'); score += 1; }
      if (t.fenced === 'yes') { secure.push('Fenced'); score += 1; }
      if (vtype === 'motorhome' && t.motorhome_stopover === 'yes') { secure.push('Motorhome stopover'); score += 2; }
      // Named spots (real car parks, not generic bays) get a base score so they survive the merge
      if (t.name) { score += 2; const op = operatorFromName(t.name); if (op) { secure.push(op + ' operated'); score += 2; } }

      // Build a useful label when OSM has no name (street added later via enrichLabels)
      let label = t.name;
      const needsStreet = !label;
      if (!label) {
        const ptype = t.parking === 'multi-storey' ? 'Multi-storey car park'
          : t.parking === 'underground' ? 'Underground car park'
          : t.parking === 'surface' ? 'Surface car park'
          : t.parking === 'street_side' ? 'On-street parking'
          : t.parking === 'lane' ? 'Parking lane'
          : vtype === 'motorcycle' ? 'Motorcycle parking'
          : 'Car park';
        label = t.operator ? `${t.operator} — ${ptype.toLowerCase()}` : ptype;
      }

      return {
        name: label,
        needsStreet,
        baseType: needsStreet ? label : null,
        dist,
        secure,
        score,
        opening: t.opening_hours || null,
        maxheight: t.maxheight || null,
        capacity: t.capacity || null,
        operator: t.operator || null,
        fee: t.fee,
        lat: plat, lon: plon,
        source: 'osm',
        _access: t.access || ''
      };
    }).filter(p => {
      if (!p.lat || p._access === 'private' || p._access === 'no') return false;
      // Drop supermarkets and staff-only on OSM side too
      const n = ((p.name || '') + ' ' + (p.operator || '')).toLowerCase();
      if (/\btesco\b|\bmorrisons?\b|\basda\b|\bsainsbury|\baldi\b|\blidl\b|\bwaitrose\b|\bco-op\b|\biceland\b|\bstaff\b|\bprivate\b/i.test(n)) return false;
      return true;
    }).sort((a,b) => (b.score - a.score) || ((a.dist||99999) - (b.dist||99999)));

    return spots;

  } catch(e) {
    return [];
  }
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function distLabel(m) {
  if (!m) return '';
  const km = (m/1000).toFixed(1);
  const walkMin = Math.max(1, Math.round(m / 80)); // ~5km/h walking
  return `${km} km &middot; ~${walkMin} min walk`;
}

function photoHtml(p) {
  if (!p.photo) return '';
  return `<img src="${p.photo}" alt="${(p.name||'Car park').replace(/"/g,'')}" loading="lazy" style="width:100%; height:140px; object-fit:cover; border:2px solid var(--ink); margin-bottom:.5rem;" onerror="this.style.display='none'">`;
}
function snippetHtml(p) {
  if (!p.reviewSnippets || !p.reviewSnippets.length) return '';
  return `<div style="margin:.5rem 0; padding:.5rem; background:#f5f1e8; border-left:3px solid var(--green); font-size:.82rem;">` +
    p.reviewSnippets.map(s => `<p style="margin:.25rem 0;"><i>"${s.text}${s.text.length >= 180 ? '…' : ''}"</i><br><span style="opacity:.7;">— ${s.author}${s.rating ? ` ★${s.rating}` : ''}</span></p>`).join('') + `</div>`;
}

function renderResults(addr, risk, parking, hotels, watchout, vtype, country) {
  const vlabel = {car:'Car', classic:'Classic', motorcycle:'Motorcycle', motorhome:'Motorhome', van:'Van'}[vtype] || vtype;
  const lit = risk.level === 'red' ? 'lit-red' : risk.level === 'amber' ? 'lit-amber' : risk.level === 'green' ? 'lit-green' : '';
  const dots = ['red','amber','green'].map(c => `<div class="tl-dot ${risk.level===c?lit:''}"></div>`).join('');
  let html = `<div class="route-sign ${risk.level}"><div class="tl-stack">${dots}</div><div><h3>${risk.title}</h3><p>${risk.detail}</p>${watchout ? `<p style="margin-top:.4rem; font-size:.82rem; opacity:.92;"><b>Street-crime watchout:</b> ${watchout}</p>` : ''}</div></div>`;

  html += `<div class="card"><h3><span class="dir-arrow">&rarr;</span>${addr}</h3><p class="meta">Vehicle: ${vlabel}</p></div>`;

  // Map with markers
  if (parking.length) {
    html += `<div class="card" style="padding:0; overflow:hidden;"><div id="pmap" style="height:280px; border:2px solid var(--ink);"></div></div>`;
  }

  if (!parking.length) {
    html += `<div class="card"><h3>No parking found within 3 km</h3><p>Neither Google nor OpenStreetMap lists parking here yet. Check directly:</p><ul><li><a href="https://www.parkopedia.com/parking/${encodeURIComponent(addr.split(',')[0])}/">Parkopedia near ${addr.split(',')[0]}</a> — ratings &amp; bookable spaces</li><li><a href="https://www.justpark.com/">JustPark</a> — reviewed private spaces nearby</li><li><a href="https://www.q-park.co.uk/en-gb/cities/manchester/">Q-Park Manchester</a> / <a href="https://www.ncp.co.uk/">NCP</a> — operator sites with CCTV &amp; barriers</li></ul></div>`;
  } else {
    const topPick = parking[0];
    const conf = topPick.score >= 5 ? ['yes','High confidence'] : topPick.score >= 2 ? ['maybe','Reasonable confidence'] : ['no','Basic — verify on arrival'];
    html += `<div class="card toppick">${photoHtml(topPick)}<h3>${topPick.name}</h3>${topPick.address ? `<p class="meta" style="margin-top:-.3rem;">${topPick.address}</p>` : ''}<p class="meta"><b>${distLabel(topPick.dist)}</b> &middot; <span class="tag ${conf[0]}">${conf[1]}</span></p><div>${topPick.secure.map(s => `<span class="tag yes">${s}</span>`).join('') || '<span class="tag maybe">Security unmapped</span>'}</div>${snippetHtml(topPick)}${parkDetails(topPick, vtype)}<p><a href="https://www.google.com/maps/dir/?api=1&destination=${topPick.lat},${topPick.lon}" target="_blank">Directions &rarr;</a> &middot; ${reviewLink(topPick)}</p></div>`;

    if (parking.length > 1) {
      html += `<div class="sec-h">Other options <span style="font-weight:normal; font-size:.8rem;">(nearest first)</span></div>`;
      [...parking.slice(1)].sort((a,b) => (a.dist||99999) - (b.dist||99999)).forEach(p => {
        const c = p.score >= 5 ? ['yes','High'] : p.score >= 2 ? ['maybe','Reasonable'] : ['no','Basic'];
        html += `<div class="card">${photoHtml(p)}<h3>${p.name}</h3>${p.address ? `<p class="meta" style="margin-top:-.3rem;">${p.address}</p>` : ''}<p class="meta"><b>${distLabel(p.dist)}</b> &middot; <span class="tag ${c[0]}">${c[1]}</span></p><div>${p.secure.map(s => `<span class="tag yes">${s}</span>`).join('') || '<span class="tag maybe">Security unknown</span>'}</div>${snippetHtml(p)}${parkDetails(p, vtype)}<p><a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank">Directions &rarr;</a> &middot; ${reviewLink(p)}</p></div>`;
      });
    }
  }

  if (hotels && hotels.length) {
    html += `<div class="sec-h">Hotels with parking nearby</div><p style="font-size:.85rem; margin-bottom:.6rem;">Overnight? A hotel with its own car park is often the most secure option.</p>`;
    hotels.forEach(h => {
      const q = encodeURIComponent(h.name);
      html += `<div class="card"><h3>${h.name}</h3><p class="meta"><b>${distLabel(h.dist)}</b>${h.stars ? ` &middot; ${h.stars}★` : ''}${h.hasParking ? ' &middot; <span class="tag yes">Parking listed</span>' : ''}</p><p><a href="https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lon}" target="_blank">Directions &rarr;</a> &middot; <a href="https://www.google.com/maps/search/?api=1&query=${q}+hotel+${h.lat},${h.lon}" target="_blank">&#9733; Reviews</a> &middot; <a href="https://www.booking.com/searchresults.html?ss=${q}" target="_blank">Check Booking.com &rarr;</a></p><p style="font-size:.82rem;">Call ahead to confirm secure/gated parking for a ${vlabel.toLowerCase()}.</p></div>`;
    });
  }

  html += confidenceChecklist(vtype, risk.level);
  $('#results').innerHTML = html;

  // Init Leaflet map
  const mapEl = document.getElementById('pmap');
  if (mapEl && parking.length && window.L) {
    const pts = parking.filter(p => p.lat && p.lon);
    if (pts.length) {
      const map = L.map('pmap');
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '© OpenStreetMap'}).addTo(map);
      const bounds = [];
      pts.forEach((p, i) => {
        const color = i === 0 ? 'green' : 'blue';
        const marker = L.marker([p.lat, p.lon], {
          icon: L.divIcon({className: '', html: `<div style="background:${color === 'green' ? '#1a7a3a' : '#1a3a7a'}; color:#fff; border:2px solid #fff; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:13px; box-shadow:0 1px 4px rgba(0,0,0,.4);">P</div>`, iconSize: [28, 28], iconAnchor: [14, 14]})
        }).addTo(map);
        marker.bindPopup(`<b>${p.name}</b><br>${p.address || ''}<br>${p.rating ? `★ ${p.rating} (${p.reviews} reviews)<br>` : ''}${(p.dist/1000).toFixed(1)} km away`);
        bounds.push([p.lat, p.lon]);
      });
      map.fitBounds(bounds, {padding: [30, 30]});
    }
  }
}

function reviewLink(p) {
  const q = encodeURIComponent((p.name || 'parking') + ' parking');
  const url = `https://www.google.com/maps/search/?api=1&query=${q}+${p.lat},${p.lon}`;
  if (p.rating) {
    return `<a href="${url}" target="_blank">&#9733; ${p.rating.toFixed(1)} (${p.reviews || 0} reviews)</a>`;
  }
  return `<a href="${url}" target="_blank">&#9733; Reviews</a>`;
}

function parkDetails(p, vtype) {
  let d = '';
  if (p.operator) d += `<p style="font-size:.85rem;">Operated by <b>${p.operator}</b></p>`;
  if (p.opening) d += `<p style="font-size:.85rem;">Hours: ${p.opening}</p>`;
  if (p.maxheight) d += `<p style="font-size:.85rem;">Max height: ${p.maxheight}${(vtype==='motorhome'||vtype==='van') ? ' — <b>check your vehicle fits</b>' : ''}</p>`;
  if (p.capacity) d += `<p style="font-size:.85rem;">Capacity: ~${p.capacity} spaces</p>`;
  return d;
}

function confidenceChecklist(vtype, riskLevel) {
  const items = {
    car: ['Lock up, take valuables with you', 'Park under a light or camera', 'Note the bay number / level'],
    classic: ['Steering-wheel lock on — visible deterrent', 'Supervised or CCTV-monitored sites only', 'Tracker armed if leaving overnight', 'Photograph condition on arrival'],
    motorcycle: ['Chain to a ground anchor or fixed object', 'Disc lock as minimum', 'Cover it — out of sight helps', 'Near CCTV or staffed entrances'],
    motorhome: ['Check height barrier before entering', 'Confirm overnight stays allowed', 'Lock all external hatches', 'Nothing valuable left outside'],
    van: ['Back against a wall where possible', 'Deadlocks on; slam-locks considered', 'Tools in a bolted box or removed', 'In view of cameras, not dark corners']
  };
  const list = (items[vtype] || items.car).map(i => `<li>${i}</li>`).join('');
  const riskNote = riskLevel === 'red'
    ? '<p style="margin-top:.5rem;"><b>High-theft area.</b> A visible deterrent is strongly advised even in supervised parking.</p>'
    : riskLevel === 'amber' ? '<p style="margin-top:.5rem;">Moderate-theft area — the basics above go a long way.</p>' : '';
  return `<div class="sec-h">Park-with-confidence checklist</div><div class="card"><ul>${list}</ul>${riskNote}</div>`;
}
</script>
